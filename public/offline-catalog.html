<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <title>Saved products | Shopping Place</title>
    <style>
      :root { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; background: #f9fafb; color: #111827; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px; }
      header, main { width: min(100%, 1100px); margin: 0 auto; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: #15803d; font-size: 18px; font-weight: 700; text-decoration: none; }
      .brand img { width: 36px; height: 36px; object-fit: contain; }
      .status, .stale { border-radius: 999px; background: #fef3c7; color: #92400e; padding: 6px 11px; font-size: 12px; font-weight: 700; }
      h1 { margin: 12px 0; font-size: clamp(26px, 6vw, 36px); }
      .notice { color: #4b5563; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; margin: 24px 0; }
      .card, .detail, .empty { overflow: hidden; border: 1px solid #e5e7eb; border-radius: 16px; background: #fff; color: inherit; text-decoration: none; }
      .card img, .detail img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #f3f4f6; }
      .card-content, .detail-content, .empty { padding: 18px; }
      .card h2, .detail h2 { margin: 9px 0; font-size: 17px; }
      .category { color: #6b7280; font-size: 12px; text-transform: uppercase; }
      .price { font-size: 18px; font-weight: 700; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
      button, .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; border: 0; border-radius: 10px; padding: 0 18px; background: #16a34a; color: #fff; cursor: pointer; font: inherit; font-weight: 700; text-decoration: none; }
      .button.secondary { border: 1px solid #d1d5db; background: transparent; color: inherit; }
      button:focus-visible, a:focus-visible { outline: 3px solid #86efac; outline-offset: 3px; }
      .saved-time { margin-top: 14px; color: #6b7280; font-size: 12px; }
      html.dark { background: #030712; color: #f9fafb; }
      html.dark .notice, html.dark .category, html.dark .saved-time { color: #d1d5db; }
      html.dark .card, html.dark .detail, html.dark .empty { border-color: #1f2937; background: #111827; }
      html.dark .button.secondary { border-color: #374151; }
      @media (prefers-color-scheme: dark) {
        html:not(.light) { background: #030712; color: #f9fafb; }
        html:not(.light) .notice, html:not(.light) .category, html:not(.light) .saved-time { color: #d1d5db; }
        html:not(.light) .card, html:not(.light) .detail, html:not(.light) .empty { border-color: #1f2937; background: #111827; }
      }
      @media (max-width: 540px) { body { padding: 16px; } header { align-items: flex-start; flex-direction: column; } }
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const dark = savedTheme === "dark" || (savedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", savedTheme === "light");
      } catch {}
    </script>
    <script src="/offline-catalog.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/"><img src="/shopping-bag.png" width="36" height="36" alt="" /><span>Shopping Place</span></a>
      <span class="status" id="connection-status">Saved catalogue</span>
    </header>
    <main>
      <h1 id="page-title">Saved products</h1>
      <p class="notice" id="notice">These saved catalogue details may be out of date. Prices and stock are not authoritative. Shopping actions, accounts, checkout and payments require an internet connection.</p>
      <div class="actions">
        <button id="refresh" type="button">Refresh catalogue</button>
        <a class="button secondary" href="/products">Browse products</a>
      </div>
      <section id="catalog" aria-live="polite"></section>
    </main>
  </body>
</html>
